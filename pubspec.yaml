name: tharaa
description: "A new Flutter project."

publish_to: 'none'


# Android
version: 1.0.0+1

# IOS
# version: 1.0.0+1

environment:
  sdk: ^3.8.1



dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Common Packages
  flutter_lints: ^6.0.0
  equatable: ^2.0.7
  json_annotation: ^4.8.1
  share_plus: ^11.0.0
  url_launcher: ^6.3.2
  fluttertoast: ^8.2.5
  lottie: ^3.1.0
  dartz: ^0.10.1
  uuid: ^4.4.0
  pinput: ^5.0.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.6
  liquid_pull_to_refresh: ^3.0.1
  carousel_slider: ^5.0.0
  flutter_html: any
  flutter_gen: any # Auto Generate assets files [icons,images,fonts ,etc..]
  cached_network_image: ^3.4.1
  responsive_framework: ^1.5.1
  # device_preview: ^1.2.0
  flutter_inappwebview: ^6.1.5
  flutter_svg: ^2.0.17
  video_player: ^2.10.0
  bounce: ^1.0.2

  # Service Locator
  get_it: ^8.0.3
  injectable: ^2.3.2

  # StateManagement
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0

  # Local Storages
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.4

  # Path Utils
  path_provider: ^2.1.5

  # Network Clients
  dio: ^5.4.0
  pretty_dio_logger: ^1.4.0
  pusher_channels_flutter: ^2.4.0

  # Media && Files
  image_picker: ^1.2.0
  file_picker: ^10.3.1
  pdfx: ^2.8.0
  mime: ^2.0.0

  # Firebase
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  firebase_remote_config: ^5.5.0
  flutter_local_notifications: ^19.2.1

  # Deeplink
  app_links: ^6.4.1

  # Maps
  google_maps_flutter: ^2.14.0
  geolocator: ^14.0.2
  location: ^8.0.1
  
  rxdart: ^0.28.0
  get_thumbnail_video: ^0.7.3
  chewie: ^1.13.0
  iconsax: ^0.0.8
  animated_flip_counter: ^0.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  injectable_generator: any
  flutter_launcher_icons: ^0.14.4
  flutter_gen_runner: any

flutter:
  generate: true
  uses-material-design: true

  assets:
    - packages/timezone/data/latest_all.tzf
    - assets/launcher_icon/
    - assets/icons/
    - assets/images/
    - assets/animations/
    - assets/illustrations/
    - assets/native_splash/
    - assets/popular_sites_icons/
    - assets/fonts/madani/
    - assets/fonts/riyal/

  fonts:
    - family: madani
      fonts:
        - asset: assets/fonts/madani/madani_arabic_light.ttf
          weight: 300
        - asset: assets/fonts/madani/madani_arabic_regular.ttf
          weight: 400
        - asset: assets/fonts/madani/madani_arabic_medium.ttf
          weight: 500
        - asset: assets/fonts/madani/madani_arabic_semi_bold.ttf
          weight: 600
        - asset: assets/fonts/madani/madani_arabic_bold.ttf
          weight: 700
        - asset: assets/fonts/madani/madani_arabic_extra_bold.ttf
          weight: 800
    - family: Riyal
      fonts:
        - asset: assets/fonts/riyal/riyal.ttf

flutter_gen:
  output: lib/core/config/values/
  fonts:
    enabled: false

  integrations:
    image: false
    flutter_svg: false
